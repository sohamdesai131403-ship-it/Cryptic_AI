  <!-- Inlined Self-Contained CSS Design System -->
  <style>
    :root {
      --bg-primary: #070b14;
      --bg-secondary: #0d1424;
      --bg-card: rgba(16, 24, 43, 0.75);
      --bg-card-hover: rgba(22, 33, 60, 0.85);
      --border-color: rgba(38, 56, 89, 0.6);
      --border-highlight: rgba(6, 182, 212, 0.4);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-cyan: #06b6d4;
      --accent-blue: #3b82f6;
      --risk-high: #ef4444;
      --risk-high-glow: rgba(239, 68, 68, 0.4);
      --risk-medium-high: #f97316;
      --risk-medium: #f59e0b;
      --risk-low: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(13, 20, 36, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(51, 65, 85, 0.8);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(6, 182, 212, 0.5);
    }

    /* Glassmorphism Panel */
    .glass-panel {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-panel:hover {
      border-color: var(--border-highlight);
    }

    /* Pulse Animations for Hotspots */
    @keyframes pulse-ring {
      0% {
        transform: scale(0.95);
        opacity: 0.9;
      }
      50% {
        transform: scale(1.6);
        opacity: 0.2;
      }
      100% {
        transform: scale(2.2);
        opacity: 0;
      }
    }

    .radar-grid {
      background-image: 
        radial-gradient(rgba(6, 182, 212, 0.15) 1px, transparent 1px),
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 24px 24px, 48px 48px, 48px 48px;
    }

    /* Leaflet Custom Styling for Dark Command Center */
    .leaflet-container {
      background-color: #060911 !important;
      font-family: inherit;
    }

    .leaflet-tile {
      /* Keep geographic detail readable while retaining the dark command-center feel. */
      filter: brightness(.68) saturate(.72) contrast(1.08);
    }

    .leaflet-popup-content-wrapper {
      background: #0d1424 !important;
      color: #f1f5f9 !important;
      border: 1px solid rgba(6, 182, 212, 0.4) !important;
      border-radius: 8px !important;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.8), 0 0 15px rgba(6, 182, 212, 0.2) !important;
    }

    .leaflet-popup-tip {
      background: #0d1424 !important;
      border: 1px solid rgba(6, 182, 212, 0.4) !important;
    }

    /* Badge Styles */
    .badge-high {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .badge-medium-high {
      background: rgba(249, 115, 22, 0.15);
      color: #fb923c;
      border: 1px solid rgba(249, 115, 22, 0.4);
    }
    .badge-medium {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }
    .badge-low {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }


    /* Advanced Intelligence Layer */
    .cs-cctv { position:relative; overflow:hidden; background:radial-gradient(circle at 50% 45%, rgba(15,23,42,.35), #020617 72%); min-height:210px; }
    .cs-cctv::before { content:""; position:absolute; inset:0; background:repeating-linear-gradient(to bottom, rgba(255,255,255,.035) 0px, rgba(255,255,255,.035) 1px, transparent 2px, transparent 5px); animation:csScan 6s linear infinite; pointer-events:none; }
    .cs-cctv::after { content:""; position:absolute; inset:-30%; background:radial-gradient(circle, transparent 0 38%, rgba(0,0,0,.28) 72%); pointer-events:none; }
    @keyframes csScan { from{transform:translateY(-20%)} to{transform:translateY(20%)} }
    @keyframes csVehicle { 0%{offset-distance:0%} 100%{offset-distance:100%} }
    .cs-vehicle { offset-path:path("M 18 170 C 110 95 180 125 275 52 C 355 -5 430 30 510 92"); offset-rotate:auto; animation:csVehicle 8s linear infinite; }
    .cs-node { transition:all .2s ease; cursor:pointer; } .cs-node:hover { filter:drop-shadow(0 0 9px rgba(34,211,238,.8)); }

    .cs-highlight-date{background:rgba(59,130,246,.18);color:#60a5fa;border-bottom:1px solid rgba(59,130,246,.55);padding:1px 3px;border-radius:3px}
    .cs-highlight-name{background:rgba(139,92,246,.18);color:#a78bfa;border-bottom:1px solid rgba(139,92,246,.55);padding:1px 3px;border-radius:3px}
    .cs-highlight-file{background:rgba(16,185,129,.18);color:#34d399;border-bottom:1px solid rgba(16,185,129,.55);padding:1px 3px;border-radius:3px}
    .cs-ticker{overflow:hidden;white-space:nowrap}.cs-ticker-track{display:inline-block;padding-left:100%;animation:csTicker 26s linear infinite}@keyframes csTicker{to{transform:translateX(-100%)}}


    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {

    /* ==========================================\n       CYBER COMMAND MOTION LAYER\n       Inspired by modern cybersecurity dashboards:\n       restrained glow, scan lines, reveal motion,\n       and live-system visual feedback.\n       ========================================== */\n    @keyframes csPageReveal {\n      from { opacity: 0; transform: translateY(8px); filter: blur(2px); }\n      to { opacity: 1; transform: translateY(0); filter: blur(0); }\n    }\n    @keyframes csPanelFloat {\n      0%,100% { transform: translateY(0); }\n      50% { transform: translateY(-2px); }\n    }\n    @keyframes csSweep {\n      0% { transform: translateX(-120%); opacity: 0; }\n      12% { opacity: .75; }\n      45% { opacity: .18; }\n      100% { transform: translateX(120%); opacity: 0; }\n    }\n    @keyframes csBorderPulse {\n      0%,100% { box-shadow: 0 0 0 1px rgba(34,211,238,.06), 0 16px 45px rgba(0,0,0,.18); }\n      50% { box-shadow: 0 0 0 1px rgba(34,211,238,.16), 0 18px 55px rgba(8,145,178,.08); }\n    }\n    @keyframes csMapScan {\n      0% { transform: translateY(-100%); opacity: 0; }\n      15% { opacity: .55; }\n      55% { opacity: .22; }\n      100% { transform: translateY(100%); opacity: 0; }\n    }\n    @keyframes csDotPulse {\n      0%,100% { transform: scale(1); opacity: .75; }\n      50% { transform: scale(1.55); opacity: 1; }\n    }\n\n    .cs-motion-page { animation: csPageReveal .48s cubic-bezier(.22,1,.36,1) both; }
    .cs-kpi-stagger > * { animation: csPageReveal .5s cubic-bezier(.22,1,.36,1) both; }
    .cs-kpi-stagger > *:nth-child(1){animation-delay:.04s}.cs-kpi-stagger > *:nth-child(2){animation-delay:.09s}.cs-kpi-stagger > *:nth-child(3){animation-delay:.14s}.cs-kpi-stagger > *:nth-child(4){animation-delay:.19s}.cs-kpi-stagger > *:nth-child(5){animation-delay:.24s}\n    .cs-motion-panel { position:relative; overflow:hidden; animation:csBorderPulse 5s ease-in-out infinite; }\n    .cs-motion-panel::after {\n      content:""; position:absolute; top:0; bottom:0; left:-35%; width:24%;\n      background:linear-gradient(90deg,transparent,rgba(34,211,238,.07),transparent);\n      transform:skewX(-18deg); pointer-events:none; animation:csSweep 7s ease-in-out infinite;\n    }\n    .cs-hover-lift { transition:transform .28s cubic-bezier(.22,1,.36,1), border-color .28s ease, box-shadow .28s ease; }\n    .cs-hover-lift:hover { transform:translateY(-3px); box-shadow:0 18px 48px rgba(0,0,0,.26),0 0 24px rgba(34,211,238,.05); }\n    .cs-map-stage { position:relative; min-height:100%; background:#050912; }\n    .cs-map-stage::before {\n      content:""; position:absolute; inset:0; z-index:450; pointer-events:none;\n      background:linear-gradient(to bottom, transparent 0%, rgba(34,211,238,.10) 48%, transparent 52%);\n      height:22%; animation:csMapScan 5.5s linear infinite; mix-blend-mode:screen;\n    }\n    .cs-map-stage::after {\n      content:""; position:absolute; inset:0; z-index:449; pointer-events:none;\n      background-image:linear-gradient(rgba(34,211,238,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.025) 1px,transparent 1px);\n      background-size:48px 48px;\n    }\n    .cs-live-indicator { animation:csDotPulse 1.8s ease-in-out infinite; }\n    .cs-map-stage .leaflet-container { position:relative; z-index:1; }\n    .cs-map-stage .leaflet-control-zoom a { background:#0b1424; color:#67e8f9; border-color:#29415d; }\n    .cs-map-stage .leaflet-control-zoom a:hover { background:#11243a; color:#fff; }\n    .cs-map-stage .leaflet-control-attribution { background:rgba(2,6,23,.78)!important; color:#64748b!important; backdrop-filter:blur(6px); }\n    .cs-map-stage .leaflet-control-attribution a { color:#67e8f9!important; }\n    .cmd-map-height { min-height:520px; }\n    .cmd-map-grid .cs-map-stage { min-height:720px; }\n\n    @media (max-width:1279px) {\n      .cmd-map-grid .cs-map-stage { min-height:620px; }\n    }\n    @media (max-width:768px) {\n      .cmd-map-height { min-height:420px; }\n      .cmd-map-grid .cs-map-stage { min-height:480px; }\n      .cs-motion-panel::after { animation-duration:10s; }\n    }\n\n
/* Dynamic command-center telemetry */
@keyframes dynTickerIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes dynSignal{0%,100%{transform:scaleY(.35);opacity:.45}50%{transform:scaleY(1);opacity:1}}

@keyframes dynPulseLine{0%{transform:translateX(-110%);opacity:0}20%{opacity:.8}70%{opacity:.2}100%{transform:translateX(110%);opacity:0}}

.cs-live-bars span:nth-child(2){animation-delay:.1s}.cs-live-bars span:nth-child(3){animation-delay:.22s}.cs-live-bars span:nth-child(4){animation-delay:.34s}.cs-live-bars span:nth-child(5){animation-delay:.46s}.cs-live-bars span:nth-child(6){animation-delay:.58s}

  --ref-panel:rgba(7,15,11,.82);
  --ref-panel2:rgba(10,20,14,.92);
  --ref-line:rgba(129,160,128,.18);
  --ref-line-hi:rgba(163,198,76,.34);
  --ref-green:#a9c635;
  --ref-green2:#40a030;
  --ref-mint:#a3baa4;
  --ref-text:#dfe8dd;
  --ref-muted:#718171;
}

html,body{background:var(--ref-bg)!important;color:var(--ref-text)!important}
body{
  background:
    radial-gradient(circle at 75% -10%,rgba(64,160,48,.12),transparent 30%),
    radial-gradient(circle at 15% 20%,rgba(169,198,53,.055),transparent 28%),
    linear-gradient(180deg,#020403 0%,#050a06 55%,#020403 100%)!important;
}
.v4-shell{background:transparent!important}
.v4-shell:before{
  opacity:.16!important;
  background-image:linear-gradient(rgba(163,198,76,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(163,198,76,.045) 1px,transparent 1px)!important;
  background-size:40px 40px!important;
}
.v4-topline{background:linear-gradient(90deg,transparent,#40a030,#a9c635,#dfe8dd,transparent)!important;opacity:.8}

/* Top command bar */
.v4-shell header{
  background:rgba(3,7,5,.86)!important;
  border-bottom:1px solid var(--ref-line)!important;
  box-shadow:0 18px 60px rgba(0,0,0,.22)!important;
  backdrop-filter:blur(18px)!important;
}
.v4-shell header input{
  background:rgba(11,19,13,.9)!important;
  border-color:rgba(129,160,128,.24)!important;
  border-radius:999px!important;
  min-height:40px;
}
.v4-shell header input:focus{border-color:rgba(169,198,53,.65)!important;box-shadow:0 0 0 3px rgba(169,198,53,.08)!important}
.v4-shell header button{transition:transform .25s ease,background .25s ease,border-color .25s ease,box-shadow .25s ease}
.v4-shell header button:hover{transform:translateY(-1px)}

/* Brand */
.v4-shell header .bg-gradient-to-br.from-cyan-500.to-blue-600{
  background:linear-gradient(135deg,#a9c635,#40a030)!important;
  box-shadow:0 0 30px rgba(169,198,53,.18)!important;
}

/* Sidebar becomes a floating dark navigation rail */
.v4-shell aside{
  background:rgba(3,8,5,.92)!important;
  border-right:1px solid var(--ref-line)!important;
  box-shadow:18px 0 50px rgba(0,0,0,.16)!important;
}
.v4-shell aside button{border-radius:12px!important;color:#788878!important}
.v4-shell aside button:hover{background:rgba(169,198,53,.055)!important;color:#dfe8dd!important}
.v4-shell aside button.bg-cyan-950\/55{
  background:linear-gradient(90deg,rgba(169,198,53,.15),rgba(64,160,48,.055))!important;
  border-color:rgba(169,198,53,.34)!important;
  color:#dfe8dd!important;
  box-shadow:inset 3px 0 0 #a9c635,0 0 28px rgba(169,198,53,.05)!important;
}
.v4-shell aside .text-cyan-300,.v4-shell aside .text-cyan-400{color:#a9c635!important}

/* Demo strip */
.v4-shell > div:first-of-type + div,
.v4-shell .bg-gradient-to-r.from-amber-950\/70{
  background:rgba(11,18,12,.78)!important;
  border-color:rgba(169,198,53,.18)!important;
  color:#a3baa4!important;
}

/* Main content spacing and editorial rhythm */
.v4-shell main{padding:24px!important}
.v4-shell .cmd-panel,
.v4-shell .glass-panel,
.v4-shell .v4-glass{
  background:linear-gradient(145deg,rgba(10,19,13,.88),rgba(4,10,7,.88))!important;
  border:1px solid var(--ref-line)!important;
  box-shadow:0 20px 70px rgba(0,0,0,.24),inset 0 1px rgba(255,255,255,.025)!important;
  backdrop-filter:blur(18px)!important;
  -webkit-backdrop-filter:blur(18px)!important;
  border-radius:18px!important;
}
.v4-shell .cmd-panel:hover,.v4-shell .glass-panel:hover{
  border-color:rgba(169,198,53,.28)!important;
}

/* Typography hierarchy */
.v4-shell .text-cyan-400,.v4-shell .text-cyan-300,.v4-shell .text-sky-400{color:#a9c635!important}
.v4-shell .text-slate-500{color:#657565!important}
.v4-shell .text-slate-400{color:#879887!important}
.v4-shell .text-white{color:#dfe8dd!important}
.v4-shell .border-slate-800,.v4-shell .border-slate-800\/70,.v4-shell .border-slate-700{border-color:rgba(129,160,128,.14)!important}

/* Dashboard KPI tiles — more like the reference's large data blocks */
.v4-shell .cmd-kpi-grid > *{
  min-height:122px;
  border-radius:16px!important;
  position:relative;
  overflow:hidden;
}
.v4-shell .cmd-kpi-grid > *:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 35%,rgba(169,198,53,.045) 50%,transparent 65%);
  transform:translateX(-100%);animation:refKpiSweep 7s ease-in-out infinite;
}
.v4-shell .cmd-kpi-grid > *:nth-child(2):before{animation-delay:.7s}
.v4-shell .cmd-kpi-grid > *:nth-child(3):before{animation-delay:1.4s}
.v4-shell .cmd-kpi-grid > *:nth-child(4):before{animation-delay:2.1s}
.v4-shell .cmd-kpi-grid > *:nth-child(5):before{animation-delay:2.8s}

/* Large map presentation */
.cmd-map-grid{grid-template-columns:minmax(0,4.4fr) minmax(260px,1.2fr)!important}
.cmd-map-grid .cs-map-stage{min-height:760px!important}
.cmd-map-height{height:640px!important;min-height:640px!important}
.cs-map-stage{background:#030705!important;border-radius:18px;overflow:hidden}
.cs-map-stage:before{background:linear-gradient(to bottom,transparent 0%,rgba(169,198,53,.10) 48%,transparent 52%)!important}
.cs-map-stage:after{
  background-image:linear-gradient(rgba(169,198,53,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(169,198,53,.035) 1px,transparent 1px)!important;
  background-size:56px 56px!important;
}
.cs-map-stage .leaflet-container{background:#030705!important}
.leaflet-tile{filter:brightness(.62) saturate(.5) contrast(1.08)!important}
.cs-map-stage .leaflet-control-zoom a{background:#08110b!important;color:#a9c635!important;border-color:#30402f!important}
.cs-map-stage .leaflet-control-zoom a:hover{background:#122013!important}

/* Filter controls */
.v4-shell select,.v4-shell input:not(header input){
  background:#08100b!important;
  border-color:rgba(129,160,128,.22)!important;
  color:#dfe8dd!important;
  border-radius:10px!important;
}
.v4-shell select:focus,.v4-shell input:not(header input):focus{border-color:rgba(169,198,53,.55)!important;box-shadow:0 0 0 3px rgba(169,198,53,.06)!important}
.v4-shell button.bg-cyan-600,.v4-shell button.bg-cyan-500,
.v4-shell button[class*="from-cyan-500"]{
  background:linear-gradient(135deg,#a9c635,#40a030)!important;
  border-color:rgba(169,198,53,.4)!important;
  color:#061006!important;
  box-shadow:0 8px 26px rgba(64,160,48,.14)!important;
}

/* Hotspots and live intelligence */
@keyframes refHotspotGlow{0%,100%{filter:drop-shadow(0 0 3px rgba(169,198,53,.25))}50%{filter:drop-shadow(0 0 12px rgba(169,198,53,.7))}}
.leaflet-marker-icon{animation:refHotspotGlow 2.8s ease-in-out infinite}
.cs-live-indicator{background:#a9c635!important;box-shadow:0 0 14px rgba(169,198,53,.8)!important}

/* Reference-style section labels */
.cmd-eyebrow,.v4-section-label{
  color:#718171!important;
  letter-spacing:.18em!important;
  font-size:9px!important;
}

/* Motion */
@keyframes refKpiSweep{0%,55%{transform:translateX(-100%)}75%,100%{transform:translateX(100%)}}
@keyframes refPanelIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes refScan{0%{transform:translateY(-110%);opacity:0}15%{opacity:.5}85%{opacity:.35}100%{transform:translateY(520%);opacity:0}}
.cmd-panel,.glass-panel{animation:refPanelIn .55s cubic-bezier(.22,1,.36,1) both}
.cmd-panel:nth-child(2){animation-delay:.08s}
.cmd-panel:nth-child(3){animation-delay:.16s}

/* Subtle luminous edge */
.cmd-map-grid > *{position:relative}
.cmd-map-grid > *:after{
  content:"";position:absolute;inset:0;border-radius:18px;pointer-events:none;
  background:linear-gradient(120deg,transparent 0%,rgba(169,198,53,.055) 48%,transparent 56%);
  transform:translateX(-110%);animation:refEdgeSweep 9s ease-in-out infinite;
}
@keyframes refEdgeSweep{0%,58%{transform:translateX(-110%)}72%,100%{transform:translateX(110%)}}

/* Make the dashboard feel spacious like the supplied reference */
@media(min-width:1440px){
  .v4-shell main{padding:30px 34px!important}
  .cmd-map-grid .cs-map-stage{min-height:800px!important}
  .cmd-map-grid{gap:18px!important}
}
@media(max-width:1100px){
  .cmd-map-grid{grid-template-columns:1fr!important}
  .cmd-map-grid .cs-map-stage{min-height:600px!important}
}
@media(max-width:768px){
  .v4-shell main{padding:14px!important}
  .cmd-map-grid .cs-map-stage{min-height:480px!important}
  .cmd-map-height{height:440px!important;min-height:440px!important}
}
@media(prefers-reduced-motion:reduce){
  .cmd-panel,.glass-panel,.cmd-kpi-grid > *:before,.cmd-map-grid > *:after,.leaflet-marker-icon{animation:none!important}
}
</style>
</head>

// 0B. LIVE RISK SCORING ENGINE (DETERMINISTIC, EXPLAINABLE)
// ------------------------------------------
// This is a genuine, auditable weighted-scoring function — it is executed
// live in the browser on whatever inputs are supplied, not a fixed lookup
// table. In production the five weights below would be learned/calibrated
// from a backtested historical outcome dataset (see Model Evaluation panel);
// today they are expert-assigned starting weights so the mechanism itself
// is real, transparent and reproducible, which is the point of this panel.
// ==========================================
function toFiniteNumber(value, fallback = 0) {
    const n = Number(value);
    return Number.isFinite(n) ? n : fallback;
}
function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#039;");
}
function matchesExpectedWindow(expectedWindow, filter) {
    if (!filter || filter === "All") return true;
    const text = String(expectedWindow || "").toLowerCase();
    const hours = { "2hours": 2, "4hours": 4, "8hours": 8 }[filter];
    if (!hours) return true;
    const match = text.match(/(\d+(?:\.\d+)?)\s*(?:-|to)?\s*(\d+(?:\.\d+)?)?\s*hours?/i);
    if (!match) return false;
    const start = Number(match[1]);
    const end = match[2] ? Number(match[2]) : start;
    return start <= hours && end <= hours;
}
function matchesCrimeCategory(pattern, category) {
    if (!category || category === "All") return true;
    const text = String(pattern || "").toLowerCase();
    const rules = {
        "Financial Fraud": ["financial", "fraud", "cash-out"],
        "UPI Fraud": ["upi", "sim-swap", "sim swap", "mule"],
        "Phishing": ["phishing", "apk", "malicious"],
        "Extortion": ["extortion", "sextortion", "courier"]
    };
    const needles = rules[category];
    return !needles || needles.some(term => text.includes(term));
}

const RiskEngine = {
    weights: {
        linkedComplaints: 0.30,
        transactionVelocity: 0.25,
        geoProximity: 0.20,
        timeCorrelation: 0.15,
        muleAccountReuse: 0.10
    },
    clamp01(v) { return Math.max(0, Math.min(1, v)); },
    compute(input = {}) {
        const linkedComplaints = Math.max(0, toFiniteNumber(input.linkedComplaints, 0));
        const txPerHour = Math.max(0, toFiniteNumber(input.txPerHour, 0));
        const distanceKm = Math.max(0, toFiniteNumber(input.distanceKm, 5));
        const hourOfDay = Math.max(0, Math.min(23.999, toFiniteNumber(input.hourOfDay, 14)));
        const muleReuseCount = Math.max(0, toFiniteNumber(input.muleReuseCount, 0));
        const w = this.weights;
        const fComplaints = this.clamp01(linkedComplaints / 25);
        const fVelocity = this.clamp01(txPerHour / 40);
        const fGeo = this.clamp01(1 / (1 + distanceKm / 2));
        const fTime = this.clamp01(1 - Math.abs(hourOfDay - 14.5) / 10);
        const fMule = this.clamp01(muleReuseCount / 10);
        const contributions = [
            { factor: "Linked Complaints", raw: linkedComplaints, normalized: fComplaints, weight: w.linkedComplaints, points: fComplaints * w.linkedComplaints * 100 },
            { factor: "Transaction Velocity", raw: txPerHour, normalized: fVelocity, weight: w.transactionVelocity, points: fVelocity * w.transactionVelocity * 100 },
            { factor: "Geographic Proximity", raw: distanceKm, normalized: fGeo, weight: w.geoProximity, points: fGeo * w.geoProximity * 100 },
            { factor: "Time-Pattern Correlation", raw: hourOfDay, normalized: fTime, weight: w.timeCorrelation, points: fTime * w.timeCorrelation * 100 },
            { factor: "Mule Account Reuse", raw: muleReuseCount, normalized: fMule, weight: w.muleAccountReuse, points: fMule * w.muleAccountReuse * 100 }
        ];
        const score = Math.round(contributions.reduce((s, c) => s + c.points, 0));
        const level = score >= 80 ? "HIGH" : score >= 60 ? "MEDIUM-HIGH" : score >= 40 ? "MODERATE" : "LOW";
        return { score, level, contributions };
    }
};
